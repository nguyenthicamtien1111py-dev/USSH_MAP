<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>USSH Smart Explorer - Lộ Trình Tối Ưu Toàn Diện</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #fff5f5; }

    #sidebar {
      width: 410px;
      height: 100%;
      background: #ffffff;
      box-shadow: 4px 0 25px rgba(255, 182, 193, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      z-index: 1000;
      overflow-y: auto;
      border-right: 2px dashed #fed7aa;
    }

    #map { flex: 1; height: 100%; z-index: 1; }

    .leaflet-tile-pane {
      filter: contrast(1.05) saturate(1.15) brightness(1.02);
    }

    .brand-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ffedd5;
    }
    .squirrel-avatar-box {
      width: 48px;
      height: 48px;
      background: #ffedd5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fb923c;
      box-shadow: 0 4px 10px rgba(251, 146, 60, 0.25);
    }
    .brand h2 { color: #9a3412; font-size: 16px; font-weight: 800; }
    .brand p { color: #ea580c; font-size: 11px; font-weight: 600; margin-top: 1px; }

    .origin-box {
      background: #fff7ed;
      border: 1.5px solid #ffedd5;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-title { font-size: 11px; font-weight: 800; color: #c2410c; text-transform: uppercase; letter-spacing: 0.5px; }
    .origin-mode-toggle { display: flex; gap: 6px; }
    .btn-toggle {
      flex: 1;
      padding: 7px;
      border: 1.5px solid #fed7aa;
      background: #fff;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #9a3412;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle.active {
      background: #f97316;
      color: #fff;
      border-color: #f97316;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
    }
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #fed7aa;
      border-radius: 8px;
      font-size: 11.5px;
      background: #fff;
      outline: none;
      color: #7c2d12;
      font-weight: 600;
    }
    select:focus { border-color: #f97316; }

    .filter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .filter-btn {
      padding: 8px 2px;
      border: 1.5px solid #ffedd5;
      background: #fffaf5;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: #9a3412;
      transition: all 0.2s;
    }
    .filter-btn.active {
      border-color: #ea580c;
      background: #ffedd5;
      color: #c2410c;
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(234, 88, 12, 0.2);
    }
    .filter-btn span.icon { font-size: 16px; }

    #categoryDestinationBox {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #categoryDestinationBox label { font-size: 11px; font-weight: 800; color: #1e40af; }

    #routeResultCard {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-left: 5px solid #16a34a;
      border-radius: 10px;
      padding: 10px 12px;
      display: none;
    }
    #routeResultCard h4 { font-size: 12px; color: #15803d; font-weight: 800; margin-bottom: 4px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 11px; color: #374151; margin-top: 2px; }
    .stat-row strong { color: #111827; }

    #infoCard {
      background: #fffaf0;
      border: 1.5px solid #feebc8;
      border-radius: 12px;
      padding: 12px;
      display: none;
    }
    #infoCard h3 { font-size: 12.5px; color: #9a3412; margin-bottom: 3px; font-weight: 800; }
    #infoCard p { font-size: 11px; color: #4b5563; line-height: 1.35; }
    .btn-nav-to {
      margin-top: 8px;
      width: 100%;
      background: #ea580c;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav-to:hover { background: #c2410c; }

    .buffer-box {
      background: #faf5ff;
      border: 1.5px solid #e9d5ff;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .buffer-box h4 { font-size: 11px; color: #6b21a8; font-weight: 800; }
    .buffer-toggle-row { display: flex; gap: 6px; }
    .buffer-btn {
      flex: 1;
      padding: 6px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1.5px solid #d8b4fe;
      background: #fff;
      color: #7e22ce;
      cursor: pointer;
    }
    .buffer-btn.active { background: #9333ea; color: #fff; border-color: #9333ea; }

    .squirrel-marker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cuteBounce 2s infinite ease-in-out;
    }
    @keyframes cuteBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .squirrel-badge {
      background: #9a3412;
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      margin-top: -4px;
      border: 1.5px solid #ffffff;
    }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; max-height: 52vh; border-radius: 20px 20px 0 0; padding: 14px; border-right: none; border-top: 2px dashed #fed7aa; }
      #map { height: 48vh; }
    }

    .lbl-tag {
      background: #ffffff;
      border: 1.5px solid #f97316;
      color: #9a3412;
      font-weight: 700;
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

      <div class="brand">
        <h2>USSH SMART EXPLORER</h2>
        <p>Lộ trình tối ưu cùng Sóc Nhân Văn 🐿️</p>
      </div>
    </div>

    <div class="origin-box">
      <div class="section-title">📍 Vị trí chú sóc (Điểm xuất phát):</div>
      <div class="origin-mode-toggle">
        <button class="btn-toggle active" id="btnModeGPS">📍 Theo bước chân (GPS)</button>

      <div id="manualSelectContainer" style="display: none; margin-top: 4px;">

        Sóc đang sẵn sàng cùng bạn dạo quanh khuôn viên!
      </div>
    </div>

    <div class="section-title">Khám phá theo nhu cầu:</div>
    <div class="filter-grid">
      <button class="filter-btn active" data-cat="all"><span class="icon">🏛️</span>Tất cả</button>
      <button class="filter-btn" data-cat="study"><span class="icon">🎓</span>Học tập</button>
      <button class="filter-btn" data-cat="water"><span class="icon">💧</span>Nước uống</button>
      <button class="filter-btn" data-cat="rest"><span class="icon">🛏️</span>Nghỉ/Tắm</button>
      <button class="filter-btn" data-cat="service"><span class="icon">🥪</span>Dịch vụ</button>
    </div>

    <div id="categoryDestinationBox">
      <label id="catBoxLabel" for="selectCategoryDest">🎯 Sóc dẫn bạn đến:</label>
      <select id="selectCategoryDest"></select>
    </div>

    <div id="routeResultCard">
      <h4 id="routeResultTitle">Đường dẫn cho Sóc</h4>
      <div class="stat-row"><span>Khoảng cách đi bộ:</span><strong id="resDistance">0 m</strong></div>
      <div class="stat-row"><span>Thời gian tung tăng:</span><strong id="resTime">0 phút</strong></div>
      <button id="btnClearRoute" style="margin-top: 6px; width: 100%; background: #e2e8f0; color: #475569; border: none; padding: 5px; border-radius: 6px; font-size: 10.5px; font-weight: 700; cursor: pointer;">Xóa lộ trình</button>
    </div>

    <div id="infoCard">
      <h3 id="cardTitle">Tên địa điểm</h3>
      <p id="cardDesc">Mô tả chi tiết</p>
      <button class="btn-nav-to" id="btnNavFromCard">🚀 Sóc ơi, dẫn đường đến đây!</button>
    </div>

    <div class="buffer-box">
      <h4>🔍 Vùng phủ sóng tiện ích (Buffer)</h4>
      <div class="buffer-toggle-row">
        <button class="buffer-btn" id="btnBuf30">Vòng 30m (~30s)</button>
        <button class="buffer-btn" id="btnBuf50">Vòng 50m (~1p)</button>
        <button class="buffer-btn" id="btnBufClear">Tắt</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

      attribution: 'Google Satellite'

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '© OpenStreetMap France'

    L.control.layers({ "Ảnh vệ tinh chi tiết": satLayer, "Bản đồ đường nét OSM": osmLayer }, null, { position: 'topright' }).addTo(map);

      "Nhà Căn tin sinh viên & Dịch vụ(1)": { category: "service", coords: [10.86995, 106.8], desc: "Căn tin trung tâm trường.", tag: "Căn tin" },
      "Nhà Căn tin sinh viên (Tòa B3)": { category: "service", coords: [10.86994, 106.79912], desc: "Quầy thức ăn nhanh mang đi khu B3.", tag: "Căn tin B3" },
      "Youth Station (Không gian Thanh niên)": { category: "service", coords: [10.87036, 106.80075], desc: "Không gian giao lưu Đoàn - Hội sinh viên.", tag: "Đoàn - Hội" },
      "Nhà NV.C1 (Nhà TDTT Đa năng)": { category: "service", coords: [10.87056, 106.80123], desc: "Sân bóng chuyền, cầu lông, thể chất.", tag: "Thể thao" },
      "Hồ Ánh Dương (Cảnh quan sinh thái)": { category: "service", coords: [10.86997, 106.79858], desc: "Hồ điều hòa sinh thái thoáng mát.", tag: "Cảnh quan" }
    };

    // MẠNG LƯỚI NÚT GIAO LỐI ĐI BỘ NỘI BỘ TOÀN DIỆN
    const waypoints = {
      "W_GATE_C":       [10.87034, 106.79771],
      "W_CORNER_C1":    [10.87045, 106.79820],
      "W_PARK_C":       [10.87062, 106.79877],
      "W_ALLEY_C_TO_A": [10.87050, 106.79920],
      "W_LAKE":         [10.86997, 106.79858],
      "W_B5":           [10.87057, 106.79942],
      "W_ROUNDABOUT":   [10.87045, 106.79995], // Vòng xuyến sân tròn giữa B5 và Khu phức hợp
      "W_NHA_A":        [10.87026, 106.79956],
      "W_CORNER_A_B4":  [10.87005, 106.79935],
      "W_B4":           [10.86985, 106.79911],
      "W_WATER_B3":     [10.86957, 106.79918],
      "W_B3":           [10.86937, 106.79969],
      "W_CANTEEN1":     [10.86995, 106.80000],
      "W_LIB":          [10.87022, 106.80037],
      "W_COMPLEX":      [10.87070, 106.80052],
      "W_YOUTH":        [10.87036, 106.80075],
      "W_GATE_B":       [10.86987, 106.80093],
      "W_PARK_B":       [10.86980, 106.80072],
      "W_TDTT":         [10.87056, 106.80123],
      "W_MID_CORNER":   [10.87120, 106.80090],
      "W_A1_MAIN":      [10.87187, 106.80183],
      "W_B1":           [10.87201, 106.80235],
      "W_A1_NORTH":     [10.87236, 106.80169],
      "W_PARK_A":       [10.87337, 106.80160],
      "W_GATE_A":       [10.87347, 106.80189]
    };

    // ĐỒ THỊ LƯỚI LIÊN KẾT ĐA CHIỀU (ĐI TẮT MỌI HƯỚNG NỘI BỘ)
    const baseGraphEdges = [
      // Trục Cổng C & Bãi xe C
      ["W_GATE_C", "W_CORNER_C1"],
      ["W_CORNER_C1", "W_PARK_C"],
      ["W_PARK_C", "W_ALLEY_C_TO_A"],
      ["W_ALLEY_C_TO_A", "W_NHA_A"],
      ["W_ALLEY_C_TO_A", "W_B5"],
      ["W_CORNER_C1", "W_LAKE"],
      ["W_LAKE", "W_B4"],

      // Cụm Sân tròn trung tâm kết nối trực tiếp (B5 <-> Khu phức hợp <-> Thư viện)
      ["W_B5", "W_ROUNDABOUT"],
      ["W_ROUNDABOUT", "W_COMPLEX"],
      ["W_ROUNDABOUT", "W_LIB"],
      ["W_ROUNDABOUT", "W_NHA_A"],
      ["W_B5", "W_COMPLEX"],
      ["W_B5", "W_LIB"],
      ["W_NHA_A", "W_LIB"],

      // Khối Nhà A, B4, B3, Căn tin
      ["W_NHA_A", "W_CORNER_A_B4"],
      ["W_CORNER_A_B4", "W_B4"],
      ["W_B4", "W_WATER_B3"],
      ["W_WATER_B3", "W_B3"],
      ["W_B3", "W_CANTEEN1"],
      ["W_NHA_A", "W_CANTEEN1"],
      ["W_NHA_A", "W_B5"],

      // Cụm Khu phức hợp, Thư viện, Cổng B & Thể thao
      ["W_CANTEEN1", "W_LIB"],
      ["W_LIB", "W_COMPLEX"],
      ["W_LIB", "W_YOUTH"],
      ["W_YOUTH", "W_GATE_B"],
      ["W_GATE_B", "W_PARK_B"],
      ["W_PARK_B", "W_CANTEEN1"],
      ["W_COMPLEX", "W_TDTT"],
      ["W_TDTT", "W_YOUTH"],

      // Trục nối từ Trung tâm lên Phía Bắc (A1, B1, Cổng A)
      ["W_COMPLEX", "W_MID_CORNER"],
      ["W_TDTT", "W_MID_CORNER"],
      ["W_ROUNDABOUT", "W_MID_CORNER"],
      ["W_MID_CORNER", "W_A1_MAIN"],
      ["W_A1_MAIN", "W_B1"],
      ["W_A1_MAIN", "W_A1_NORTH"],
      ["W_A1_NORTH", "W_PARK_A"],
      ["W_PARK_A", "W_GATE_A"]
    ];

    const markersGroup = L.layerGroup().addTo(map);
    const bufferGroup = L.layerGroup().addTo(map);
    let activeRouteLayer = null;

    let activeCategory = "all";
    let activeBufferRadius = 0;
    let currentOriginCoords = null;
    let currentTargetName = null;
    let squirrelMarker = null;

    function getColorByCategory(cat) {
      if (cat === "study") return "#ea580c";
      if (cat === "water") return "#0284c7";
      if (cat === "rest") return "#a855f7";
      if (cat === "service") return "#16a34a";
      return "#f97316";
    }

    function updateCategoryDropdown() {
      const selectDest = document.getElementById('selectCategoryDest');
      selectDest.innerHTML = '<option value="">-- Chọn nơi bạn muốn Sóc dẫn đến --</option>';

      Object.entries(poiData).forEach(([name, data]) => {
        if (activeCategory === "all" || data.category === activeCategory) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          selectDest.appendChild(opt);
        }
      });
    }

    function renderMapContent() {
      markersGroup.clearLayers();
      bufferGroup.clearLayers();
      updateCategoryDropdown();

      Object.entries(poiData).forEach(([name, data]) => {
        if (activeCategory !== "all" && data.category !== activeCategory) return;

        const color = getColorByCategory(data.category);

        const marker = L.circleMarker(data.coords, {
          radius: (data.category === "rest" || data.category === "water") ? 7.5 : 6.5,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          fillOpacity: 0.95
        });

        marker.bindTooltip(name, {
          permanent: false,
          direction: 'top',
          className: 'lbl-tag',
          offset: [0, -6]
        });

        marker.on('click', () => {
          currentTargetName = name;
          document.getElementById('cardTitle').innerText = name;
          document.getElementById('cardDesc').innerText = data.desc;
          document.getElementById('infoCard').style.display = 'block';
          map.panTo(data.coords);
        });

        markersGroup.addLayer(marker);

        if (activeBufferRadius > 0 && (data.category === "water" || data.category === "rest")) {
          const bufferCircle = L.circle(data.coords, {
            radius: activeBufferRadius,
            color: color,
            weight: 1.5,
            dashArray: '4, 4',
            fillColor: color,
            fillOpacity: 0.2
          });
          bufferGroup.addLayer(bufferCircle);
        }
      });
    }

    renderMapContent();

    function calcDistance(c1, c2) {
      const R = 6371e3;
      const dLat = (c2[0] - c1[0]) * Math.PI / 180;
      const dLon = (c2[1] - c1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // THUẬT TOÁN TỐI ƯU TOÀN DIỆN (Nối đa hướng điểm đầu và điểm cuối vào đồ thị)
    function solveOptimalPath(startPt, endPt) {
      const directDist = calcDistance(startPt, endPt);
      // Nếu 2 điểm quá gần (dưới 50m) -> Đi bộ thẳng trực tiếp
      if (directDist <= 50) {
        return [startPt, endPt];
      }

      // Xây dựng đồ thị mở rộng tạm thời
      const localWaypoints = { ...waypoints };
      localWaypoints["__START__"] = startPt;
      localWaypoints["__END__"] = endPt;

      const localEdges = [...baseGraphEdges];

      // Tìm 3 nút giao gần nhất với điểm xuất phát
      const startDistances = Object.keys(waypoints).map(k => ({
        key: k,
        d: calcDistance(startPt, waypoints[k])
      })).sort((a, b) => a.d - b.d);

      for (let i = 0; i < Math.min(3, startDistances.length); i++) {
        localEdges.push(["__START__", startDistances[i].key]);
      }

      // Tìm 3 nút giao gần nhất với điểm kết thúc
      const endDistances = Object.keys(waypoints).map(k => ({
        key: k,
        d: calcDistance(endPt, waypoints[k])
      })).sort((a, b) => a.d - b.d);

      for (let i = 0; i < Math.min(3, endDistances.length); i++) {
        localEdges.push([endDistances[i].key, "__END__"]);
      }

      // Thiết lập ma trận kề
      const adj = {};
      Object.keys(localWaypoints).forEach(k => adj[k] = []);
      localEdges.forEach(([u, v]) => {
        if (localWaypoints[u] && localWaypoints[v]) {
          const d = calcDistance(localWaypoints[u], localWaypoints[v]);
          adj[u].push({ node: v, weight: d });
          adj[v].push({ node: u, weight: d });
        }
      });

      // Dijkstra
      const distances = {}, prev = {}, queue = new Set(Object.keys(localWaypoints));
      Object.keys(localWaypoints).forEach(k => { distances[k] = Infinity; prev[k] = null; });
      distances["__START__"] = 0;

      while (queue.size > 0) {
        let curr = null;
        for (const node of queue) {
          if (curr === null || distances[node] < distances[curr]) curr = node;
        }
        if (curr === "__END__" || distances[curr] === Infinity) break;
        queue.delete(curr);

        for (const neighbor of adj[curr]) {
          const alt = distances[curr] + neighbor.weight;
          if (alt < distances[neighbor.node]) {
            distances[neighbor.node] = alt;
            prev[neighbor.node] = curr;
          }
        }
      }

      const path = [];
      let step = "__END__";
      while (step) {
        path.unshift(localWaypoints[step]);
        step = prev[step];
      }

      return path;
    }

    function navigateToDestination(destName) {
      if (!destName || !poiData[destName]) return;
      if (!currentOriginCoords) {
        alert("Chưa có vị trí của bạn và Sóc! Hãy chọn một điểm xuất phát trước.");
        return;
      }

      const startPt = currentOriginCoords;
      const endPt = poiData[destName].coords;

      // Tìm đường tối ưu tuyệt đối
      const route = solveOptimalPath(startPt, endPt);

      if (activeRouteLayer) map.removeLayer(activeRouteLayer);

      activeRouteLayer = L.polyline(route, {
        color: '#f97316',
        weight: 6,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round',
        dashArray: '2, 8'
      }).addTo(map);

      map.fitBounds(activeRouteLayer.getBounds(), { padding: [40, 40] });

      let meters = 0;
      for (let i = 0; i < route.length - 1; i++) {
        meters += calcDistance(route[i], route[i+1]);
      }
      meters = Math.round(meters);
      const mins = Math.max(1, Math.ceil(meters / 75));

      document.getElementById('routeResultTitle').innerText = "Đường đi tới: " + destName;
      document.getElementById('resDistance').innerText = meters + " m";
      document.getElementById('resTime').innerText = "~" + mins + " phút";
      document.getElementById('routeResultCard').style.display = 'block';
    }

    document.getElementById('selectCategoryDest').addEventListener('change', function() {
      if (this.value) navigateToDestination(this.value);
    });

    document.getElementById('btnNavFromCard').addEventListener('click', function() {
      if (currentTargetName) navigateToDestination(currentTargetName);
    });

    document.getElementById('btnClearRoute').addEventListener('click', function() {
      if (activeRouteLayer) map.removeLayer(activeRouteLayer);
      document.getElementById('routeResultCard').style.display = 'none';
      document.getElementById('selectCategoryDest').selectedIndex = 0;
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeCategory = this.getAttribute('data-cat');

        const catNames = { all: "tất cả", study: "học tập", water: "nước uống", rest: "nghỉ ngơi/tắm", service: "dịch vụ" };
        document.getElementById('catBoxLabel').innerText = `🎯 Sóc dẫn bạn đến (${catNames[activeCategory]}):`;

        renderMapContent();
      });
    });

    function moveSquirrelTo(coords) {
      currentOriginCoords = coords;
      if (!squirrelMarker) {
        squirrelMarker = L.marker(coords, { icon: squirrelSVGIcon }).addTo(map);
      } else {
        squirrelMarker.setLatLng(coords);
      }
      map.panTo(coords);
    }

    let gpsWatchId = null;

    document.getElementById('btnModeGPS').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnModeManual').classList.remove('active');
      document.getElementById('manualSelectContainer').style.display = 'none';
      document.getElementById('gpsStatusText').style.display = 'block';

      if (!navigator.geolocation) {
        alert("Thiết bị không hỗ trợ GPS!");
        return;
      }
      document.getElementById('gpsStatusText').innerText = "Đang kết nối GPS...";

      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const userCoords = [pos.coords.latitude, pos.coords.longitude];
          moveSquirrelTo(userCoords);
          document.getElementById('gpsStatusText').innerText = "🐾 Sóc đang chạy theo bước chân thực tế của bạn!";
        },
        () => { document.getElementById('gpsStatusText').innerText = "⚠️ Hãy cấp quyền GPS trên trình duyệt!"; },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    });

    document.getElementById('btnModeManual').addEventListener('click', function() {
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
      this.classList.add('active');
      document.getElementById('btnModeGPS').classList.remove('active');
      document.getElementById('manualSelectContainer').style.display = 'block';
      document.getElementById('gpsStatusText').style.display = 'none';

      const chosen = selectOrigin.value;
      if (poiData[chosen]) moveSquirrelTo(poiData[chosen].coords);
    });

    const selectOrigin = document.getElementById('selectOriginPoint');
    Object.keys(poiData).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      selectOrigin.appendChild(opt);
    });

    selectOrigin.addEventListener('change', function() {
      if (poiData[this.value]) moveSquirrelTo(poiData[this.value].coords);
    });

    // Mặc định đặt chú sóc tại sảnh Nhà A
    moveSquirrelTo(poiData["Nhà NV.A (Tòa nhà Trung tâm - Sảnh A)"].coords);

    document.getElementById('btnBuf30').addEventListener('click', function() {
      activeBufferRadius = 30;
      updateBufBtns(this);
      renderMapContent();
    });
    document.getElementById('btnBuf50').addEventListener('click', function() {
      activeBufferRadius = 50;
      updateBufBtns(this);
      renderMapContent();
    });
    document.getElementById('btnBufClear').addEventListener('click', function() {
      activeBufferRadius = 0;
      updateBufBtns(null);
      renderMapContent();
    });
    function updateBufBtns(activeBtn) {
      document.querySelectorAll('.buffer-btn').forEach(b => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }
  </script>
